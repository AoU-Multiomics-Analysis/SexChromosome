name: WDL validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/wdl-validation.yml
      - workflows/**/*.wdl
      - scripts/xyalign_runner.py
      - tools/check_terra_wdl.py
      - tests/**
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wdl-validation.yml
      - workflows/**/*.wdl
      - scripts/xyalign_runner.py
      - tools/check_terra_wdl.py
      - tests/**

permissions:
  contents: read

jobs:
  miniwdl-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install miniwdl
        run: python -m pip install miniwdl==1.13.1

      - name: Check WDL syntax
        shell: bash
        run: |
          shopt -s globstar nullglob
          wdls=(workflows/**/*.wdl)
          if [ ${#wdls[@]} -eq 0 ]; then
            echo "No WDL files found under workflows/." >&2
            exit 1
          fi
          for wdl in "${wdls[@]}"; do
            echo "Checking ${wdl}"
            miniwdl check "${wdl}"
          done

      - name: Check Terra file creation rules
        run: python tools/check_terra_wdl.py workflows/*.wdl

      - name: Run wrapper and localization tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
